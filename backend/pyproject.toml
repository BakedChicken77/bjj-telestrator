[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: real native FFmpeg export tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# scripts/verify.py runs in backend; CI runs from the repository root.
# Explicit classification keeps the same gate in both working directories.
known-first-party = ["app", "test_backend", "test_renderer"]
