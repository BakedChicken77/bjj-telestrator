name: Native iPhone preview
on:
  push:
    branches: [preview/native-iphone]
permissions:
  contents: read
concurrency:
  group: native-preview
  cancel-in-progress: false
jobs:
  authorize:
    name: Preview authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require repository owner to initiate preview
        env:
          EXPECTED_ACTOR: BakedChicken77
        run: test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
  checks:
    needs: authorize
    uses: ./.github/workflows/ci.yml
  sign:
    needs: checks
    if: vars.IOS_SIGNING_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 65
    environment: ios-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run ios:sync
        working-directory: frontend
      - name: Sign and export IPA
        run: python3 scripts/ci/sign_ios.py
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
      - name: Upload to TestFlight when explicitly enabled
        if: vars.IOS_UPLOAD_TESTFLIGHT == 'true'
        run: python3 scripts/ci/upload_testflight.py
        env:
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testflight-receipt
          path: .ci-artifacts/testflight-*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-signed
          path: .ci-artifacts/signed/*.ipa
          if-no-files-found: error
          retention-days: 7
