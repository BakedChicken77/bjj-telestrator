name: Release
on:
  push:
    tags: ['v*']
    branches: [preview/native-iphone]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  authorize:
    name: Release authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require repository owner to initiate release
        env:
          EXPECTED_ACTOR: BakedChicken77
        run: test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
  validate:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.ref_type == 'tag'
        run: python3 scripts/ci/release.py validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Validate internal preview version
        if: github.ref_type == 'branch'
        run: python3 -c 'import json; from scripts.ci.release import validate_version; validate_version("v" + json.load(open("frontend/package.json"))["version"])'
  checks:
    needs: validate
    if: "!contains(github.event.head_commit.message, '[feedback-only]')"
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python3 scripts/ci/release.py package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-unsigned
          path: .ci-artifacts/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: .ci-artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  sign:
    needs: checks
    if: vars.IOS_SIGNING_ENABLED == 'true' && !contains(github.event.head_commit.message, '[feedback-only]')
    runs-on: macos-26
    timeout-minutes: 65
    environment: ios-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run ios:sync
        working-directory: frontend
      - name: Sign and export IPA
        run: python3 scripts/ci/sign_ios.py
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
      - name: Upload to TestFlight when explicitly enabled
        if: vars.IOS_UPLOAD_TESTFLIGHT == 'true'
        run: python3 scripts/ci/upload_testflight.py
        env:
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testflight-receipt
          path: .ci-artifacts/testflight-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-signed
          path: .ci-artifacts/signed/*.ipa
          if-no-files-found: error
          retention-days: 7
  feedback:
    needs: validate
    if: "contains(github.event.head_commit.message, '[feedback-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch sanitized TestFlight feedback
        run: python3 scripts/ci/fetch_testflight_feedback.py
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-feedback
          path: .ci-artifacts/testflight-feedback/latest.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [checks, package, sign]
    if: always() && github.ref_type == 'tag' && needs.checks.result == 'success' && needs.package.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: .ci-artifacts/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.sign.result == 'success'
        with:
          name: ios-signed
          path: .ci-artifacts/release
      - run: python3 scripts/ci/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IOS_DEVICE_ACCEPTED: ${{ vars.IOS_DEVICE_ACCEPTED }}
          IOS_DEVICE_ACCEPTED_SHA: ${{ vars.IOS_DEVICE_ACCEPTED_SHA }}
          IOS_DEVICE_ACCEPTED_VERSION: ${{ vars.IOS_DEVICE_ACCEPTED_VERSION }}
          IOS_DEVICE_ACCEPTED_BUILD: ${{ vars.IOS_DEVICE_ACCEPTED_BUILD }}
          IOS_DEVICE_EVIDENCE_URL: ${{ vars.IOS_DEVICE_EVIDENCE_URL }}
